server:
  port: 8080

spring:
  application:
    name: user
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/user
    username: postgres
    password: 1111
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    hibernate:
      ddl-auto: update

  kafka:
     bootstrap-servers: localhost:9092
     partitions: 3
     topics:
       user-register: user-register-topics
       user-remove: user-remove-topics
       user-update: user-update-topics


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

security:
  jwt:
    secret: dycoQOTL7Bh5QmdXHFCkjj6mMkNyzrU/Rytscmt7dSK61iirkEtB0rHaClQ5ThDH
    expiration: 3600000
