server:
  port: 0

spring:
  application:
    name: sender
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/notification
    username: postgres
    password: 1111
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092
    topics:
      email: email-notification
      phone: phone-notification

  config:
    import: secret.yml

services:
  notification: notification-service

notification:
  maxRetryAttempts: 3
  mail:
    from: giorgimeshve@gmail.com


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true